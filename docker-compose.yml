services:
  api:
    build: .
    image: vobchat:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-vob}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-pass}
      DB_SCHEMA: ${DB_SCHEMA:-hgis}
      DB_READ_ONLY: ${DB_READ_ONLY:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_OPENAI_BASE_URL: ${LLM_OPENAI_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_VERIFY_SSL: ${LLM_VERIFY_SSL:-true}
      VOBCHAT_LOG_LEVEL: ${VOBCHAT_LOG_LEVEL:-INFO}
      VOBCHAT_LLM_LOG_LEVEL: ${VOBCHAT_LLM_LOG_LEVEL:-INFO}
    command:
      [
        "uvicorn",
        "vobchat.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    expose:
      - "8000"
    volumes:
      - ./logs:/app/logs
      - ./src:/app/src
    restart: unless-stopped

  web:
    build: .
    image: vobchat:latest
    depends_on:
      - api
    ports:
      - "127.0.0.1:8050:8050"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-vob}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-pass}
      DB_SCHEMA: ${DB_SCHEMA:-hgis}
      DB_READ_ONLY: ${DB_READ_ONLY:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_OPENAI_BASE_URL: ${LLM_OPENAI_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_VERIFY_SSL: ${LLM_VERIFY_SSL:-true}
      DASH_DEBUG: ${DASH_DEBUG:-true}
      DASH_URL_BASE_PATHNAME: ${DASH_URL_BASE_PATHNAME:-/}
      DASH_HOST: 0.0.0.0
      DASH_PORT: 8050
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-sqlite:////app/data/users.db}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      SESSION_COOKIE_HTTPONLY: ${SESSION_COOKIE_HTTPONLY:-true}
      WTF_CSRF_ENABLED: ${WTF_CSRF_ENABLED:-true}
      VOBCHAT_API_BASE_URL: http://api:8000
      VOBCHAT_LOG_LEVEL: ${VOBCHAT_LOG_LEVEL:-INFO}
      VOBCHAT_LLM_LOG_LEVEL: ${VOBCHAT_LLM_LOG_LEVEL:-INFO}
    command:
      [
        "gunicorn",
        "--config",
        "/app/src/vobchat/gunicorn.conf.py",
        "vobchat.web.app:server",
      ]
    volumes:
      - ./logs:/app/logs
      - ./src:/app/src
      - ./data:/app/data
    restart: unless-stopped
