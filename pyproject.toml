[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vobchat"
version = "0.1.0"
description = "Dash and FastAPI application for exploring Vision of Britain data through authenticated chat, maps, and charts."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Xan Morice-Atkinson" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]
dependencies = [
    "dash>=3.0.4",
    "dash-bootstrap-components>=2.0.3",
    "dash-extensions>=1.0.15",
    "dash-leaflet>=1.0.15",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "flask>=3.0.3",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "gevent>=24.0.0",
    "httpx>=0.28.1",
    "argon2-cffi>=25.1.0",
    "passlib>=1.7.4",
    "sqlalchemy>=2.0.41",
    "psycopg[binary]>=3.3.3",
    "pandas>=2.3.0",
    "plotly>=6.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vobchat = "vobchat.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
